[package]
name = "aerie"
version = "0.1.0"
description = "Personal Windows notch overlay with everyday tools"
authors = ["Aerie contributors"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows.
name = "aerie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
